<style>
:root {
  /* Light (default). The dark palette below applies when <html data-theme="dark">. */
  color-scheme: light;
  --bg: #ffffff; --panel: #ffffff; --card: #f4f4f4; --ink: #151515; --body-ink: #2b2b2b; --muted: #6b6b6b; --muted-2: #8f8f8f; --line: #e4e4e4; --line-2: #d2d2d2;
  --accent: #f2a23a; --accent-press: #b8620e; --accent-hover: #ffb34d; --accent-ink: #a85a0c; --accent-soft: rgba(242, 162, 58, 0.18); --on-accent: #181818; --focus: #f2a23a; --ok: #03904a; --warn: #d92d20; --info: #2f7fa3;
  --chip: #f0f0f0; --hover: #f2f2f2; --code-bg: #f6f6f6;
  --hl-kw: #cf222e; --hl-str: #0a7d33; --hl-num: #b35900; --hl-cmt: #6e7781; --hl-fn: #0550ae; --hl-meta: #8250df;
  --dg-bg: #ffffff; --dg-card: #f7f7f7; --dg-line: #c9c9c9; --dg-ink: #151515; --dg-muted: #5f5f5f; --dg-accent: #e0891c;
  --font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  /* Cinematic dark: near-black canvas, one scarce Amber accent (the logo's #F2A23A), white type at weight 500, sharp corners. */
  --bg: #181818; --panel: #181818; --card: #303030; --ink: #ffffff; --muted: #969696; --muted-2: #666666; --line: #303030;
  --accent: #f2a23a; --accent-press: #b8620e; --accent-soft: rgba(242, 162, 58, 0.16); --on-accent: #181818; --ok: #03904a; --warn: #f13a2c; --info: #4c98b9;
  --chip: #303030; --hover: #222222; --code-bg: #111111;
  --hl-kw: #ff7b72; --hl-str: #a5d6a7; --hl-num: #ffb74d; --hl-cmt: #7d7d7d; --hl-fn: #90caf9; --hl-meta: #e5c07b;
  --font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: dark;
  --body-ink: #d6d6d6; --line-2: #444444; --accent-hover: #ffb34d; --accent-ink: #f2a23a; --focus: #ffd27a;
  --dg-bg: #181818; --dg-card: #262626; --dg-line: #4a4a4a; --dg-ink: #ffffff; --dg-muted: #a8a8a8; --dg-accent: #f2a23a;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "PingFang SC", "Noto Sans SC", system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
header img { width: 28px; height: 28px; border-radius: 7px; }
header .brand { font-weight: 700; font-size: 17px; }
header .who { margin-left: auto; color: var(--muted); font-size: 14px; display: flex; gap: 14px; align-items: center; }
header .who-inner { display: flex; gap: 10px; align-items: center; }
header .doclink { color: var(--muted); text-decoration: none; }
header .doclink:hover { color: var(--accent-ink); }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn.small { padding: 2px 10px; font-size: 13px; }
button:disabled { opacity: .55; cursor: default; }
.note { color: var(--muted); font-size: 13px; }
.chip { font-size: 12px; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-weight: 400; white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.warn { color: var(--warn); }
code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }

/* login */
#app.center { overflow: auto; }
.login { text-align: center; padding: 48px 16px; }
.login img { width: 96px; height: 96px; border-radius: 22px; }
.login h1 { margin: 16px 0 4px; font-size: 28px; }
.steps { text-align: left; max-width: 420px; margin: 0 auto 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.steps ol { margin: 0; padding-left: 20px; }

/* two panes */
#app { flex: 1; min-height: 0; }
#app.split { display: grid; grid-template-columns: 300px 1fr; }
#tree { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px 8px 24px; }
#pane { overflow: auto; padding: 24px 32px 48px; }
.search { width: 100%; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); margin-bottom: 8px; }
.banner { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 0 4px 8px; }
details.node { margin: 2px 0; }
details.node > summary { list-style: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: center; }
details.node > summary::-webkit-details-marker { display: none; }
details.node > summary::before { content: '▸'; color: var(--muted); font-size: 11px; width: 10px; transition: transform .1s; }
details.node[open] > summary::before { transform: rotate(90deg); }
details.node > summary:hover { background: var(--hover); }
details.node > summary .count { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: auto; }
details.node details.node { margin-left: 14px; }
details.node details.node > summary { font-weight: 500; color: var(--muted); }
.leaf { display: flex; gap: 6px; align-items: center; padding: 4px 6px 4px 22px; border-radius: 6px; cursor: pointer; font-size: 14px; overflow: hidden; }
.leaf .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaf .sub { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.leaf:hover { background: var(--hover); }
.leaf.sel { background: var(--accent-soft); color: var(--accent-ink); }
.leaf .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); }
.leaf .dot.ok { background: var(--ok); } .leaf .dot.failed { background: var(--warn); } .leaf .dot.paused { background: var(--warn); }
.leaf.sch.child { padding-left: 38px; font-size: 13px; }
.leaf.sch .clock { font-size: 12px; }
.leaf .state { margin-left: auto; font-size: 12px; white-space: nowrap; }
.leaf .state.active { color: var(--ok); } .leaf .state.paused { color: var(--warn); }
.examples { flex: 1; font-size: 13px; color: var(--muted); line-height: 2; }
.chip.ex { border: 1px solid var(--line); cursor: pointer; font: inherit; font-size: 12px; padding: 1px 8px; }
.chip.ex:hover { border-color: var(--accent); color: var(--accent-ink); }
.empty-leaf { padding: 2px 6px 6px 22px; color: var(--muted); font-size: 13px; }

/* right pane */
.pane-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pane-head h1 { font-size: 22px; margin: 0; }
.where { color: var(--muted); font-size: 13px; margin-top: 2px; }
.desc { color: var(--muted); margin: 8px 0 16px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; }
.box h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
.field { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.field label { min-width: 96px; color: var(--muted); font-size: 14px; }
.field input, .field select { flex: 1; min-width: 180px; max-width: 420px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); }
.tabs button.on { color: var(--accent-ink); border-bottom-color: var(--accent); font-weight: 600; }
.output { border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; background: var(--panel); overflow-x: auto; }
.output.err { border-color: var(--warn); color: var(--warn); }
.output.wait { color: var(--muted); }
.output table { border-collapse: collapse; font-size: 14px; margin: 8px 0; }
.output th, .output td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.output th { background: var(--bg); }
.output td.num { text-align: right; font-variant-numeric: tabular-nums; }
.output .meta { color: var(--muted); font-size: 12px; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.output .chart { width: 100%; margin: 8px 0; }
pre.diff { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow: auto; max-height: 50vh; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre; }
.code { display: grid; grid-template-columns: auto 1fr; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 70vh; font: 13px/1.6 ui-monospace, Menlo, monospace; }
.code pre { margin: 0; padding: 10px 0; }
.code .gutter { text-align: right; color: var(--muted); user-select: none; padding: 10px 12px 10px 14px; border-right: 1px solid var(--line); }
.code .src { padding: 10px 16px; color: var(--ink); }
/* syntax colours (highlight.js classes), tuned for both themes */
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-kw); font-weight: 600; }
.hljs-string, .hljs-regexp { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-comment { color: var(--hl-cmt); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--hl-fn); }
.hljs-params, .hljs-variable, .hljs-attr { color: var(--ink); }
.hljs-meta, .hljs-decorator { color: var(--hl-meta); }
.hljs-subst { color: var(--ink); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 14px; margin-bottom: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
.envblock { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.envblock h3 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
.envblock h3 .sub { font-size: 12px; font-weight: 400; color: var(--muted); }
ul.paths { list-style: none; margin: 0; padding: 0; }
ul.paths li { padding: 1px 0; word-break: break-all; }
.cred { color: var(--warn); }
.manage { margin-top: 28px; padding-top: 12px; border-top: 1px dashed var(--line); }
.manage h3 { margin: 0 0 6px; }
.welcome { color: var(--muted); max-width: 560px; margin-top: 40px; }
.welcome h2 { color: var(--ink); font-size: 20px; }
.back { display: none; }

/* narrow screens: list first, then detail */
@media (max-width: 860px) {
  #app.split { grid-template-columns: 1fr; }
  #app.split #pane { display: none; padding: 16px; }
  #app.split.detail #tree { display: none; }
  #app.split.detail #pane { display: block; }
  #tree { border-right: none; }
  .back { display: inline-block; margin-bottom: 12px; }
  header .who span.name { display: none; }
}

/* ---- Ferrari-inspired overrides ---- */
body { font-family: var(--font); font-size: 14px; letter-spacing: 0; }
a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent-ink); }

header .who, header .doclink { font-size: 12px; font-weight: 600; letter-spacing: 0.65px; text-transform: uppercase; }
header .doclink:hover { color: var(--ink); }
button, .btn { border-radius: 0; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; padding: 10px 24px; line-height: 1.2; }
button:hover, .btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.btn.danger { background: transparent; border-color: var(--warn); color: var(--warn); }
.btn.small { padding: 6px 14px; font-size: 11px; letter-spacing: 1.1px; }
.chip { background: var(--card); color: var(--ink); font-size: 11px; font-weight: 600; letter-spacing: 1.1px; padding: 2px 10px; }
.chip.accent { background: var(--accent); color: var(--on-accent); }

#tree { background: var(--panel); padding: 16px 8px 32px; }

.search, .field input, .field select { border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px 14px; }
.search:focus, .field input:focus, .field select:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
details.node > summary { border-radius: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.2px; color: var(--ink); padding: 9px 8px; }
details.node > summary:hover { background: var(--hover); color: var(--ink); }
details.node > summary::before { color: var(--muted); }
details.node > summary .count { color: var(--muted); font-size: 12px; }
details.node details.node > summary { font-size: 13px; font-weight: 500; color: var(--body-ink); padding: 7px 8px; }
.leaf { border-radius: 0; border-left: 2px solid transparent; padding: 7px 8px 7px 20px; }
.leaf:hover { background: var(--hover); }
.leaf.sel { background: var(--hover); color: var(--ink); border-left-color: var(--accent); }
.leaf .chip { margin-left: 4px; }
/* Tree levels: what a folder holds sits one step to the right of the folder's name, on a guide line. */
details.node > .leaf, details.node > .empty-leaf { margin-left: 13px; border-left: 2px solid var(--line); }
details.node > .leaf.sel { border-left-color: var(--accent); }
details.node > .empty-leaf { padding: 6px 8px 6px 20px; }
details.node details.node { margin-left: 13px; padding-left: 0; border-left: 2px solid var(--line); }
.pane-head h1 { font-size: 36px; font-weight: 500; letter-spacing: -0.36px; line-height: 1.2; }

.box .field input, .box .field select { background: var(--bg); }
.field label { color: var(--muted); font-size: 13px; }

<body>
<header>
  <img src="/logo.svg" alt="">
  <span class="brand">Amber</span>
  <span class="who"><button class="themebtn" id="themebtn" type="button" title="切换浅色 / 深色"><svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9z"/></svg><svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M4 16l1.4-1.4M14.6 5.4 16 4"/></svg></button><a class="doclink" href="/docs" target="_blank" rel="noopener">文档</a><span id="who" class="who-inner"></span></span>
</header>
<main id="app"><p class="note" style="padding:16px">加载中……</p></main>
<script>
// Light / dark: light unless this browser chose dark. Pages that draw with JS listen for "amber-theme".
document.getElementById('themebtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('amber-theme', dark ? 'dark' : 'light'); } catch {}
  document.dispatchEvent(new Event('amber-theme'));
});
const FEISHU = '__FEISHU_CHAT_LINK__';
const app = document.getElementById('app');
const whoEl = document.getElementById('who');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = t => { const d = new Date(t); return `${d.getMonth() + 1}-${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const CH = { bot: '飞书', web: '网站', agent: 'agent', schedule: '定时', 'bot.trial': '试运行', 'agent.trial': '试运行' };

function loginView() {
  whoEl.innerHTML = '';
  app.className = 'center';
  app.innerHTML = `
    <div class="login">
      <img class="why" src="/docs/assets/amber-why.gif" width="520" height="292" alt="为什么叫 Amber：琥珀把一瞬间封存起来，多年后取出还是原样。Amber 把和 AI 一起跑通的操作封存起来，审核通过后按哈希锁定，以后每次执行都和审核时一模一样。">
      <div class="login-side">
      <h2 class="login-title">登录 Amber 网站</h2>
      <div class="steps"><ol>
        <li>在飞书里打开与 <b>Amber</b> 的私聊</li>
        <li>发送「<b>登录</b>」</li>
        <li>点卡片上的「打开 Amber 网站」</li>
      </ol></div>

      <p class="note" style="margin-top:20px">登录链接 5 分钟内有效、只能用一次，请不要转发给别人。</p>
      </div>
    </div>`;
}

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ ok: false, message: '服务器返回异常' }));
  if (r.status === 401) { loginView(); throw new Error('请重新登录'); }
  return j;
}

// ---- output rendering: Markdown + ```table + ```vega-lite (the same content the Feishu card shows)
function tableHtml(src) {
  let t; try { t = JSON.parse(src); } catch { return '<p class="note">（表格格式不正确）</p>'; }
  if (!Array.isArray(t.columns) || !Array.isArray(t.rows)) return '<p class="note">（表格格式不正确）</p>';
  const head = t.columns.map(c => `<th>${esc(c.label ?? c.name)}</th>`).join('');
  const body = t.rows.map(r => '<tr>' + t.columns.map(c => `<td class="${c.type === 'number' ? 'num' : ''}">${esc(r[c.name] ?? '')}</td>`).join('') + '</tr>').join('');
  const more = Number.isFinite(t.total) && t.total > t.rows.length ? `<p class="note">共 ${t.total} 行，这里显示 ${t.rows.length} 行</p>` : '';
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${more}`;
}

/** Simple single-view line/bar charts get the value printed on each point/bar (same as the Feishu card). */
function withValueLabels(spec) {
  const mark = typeof spec.mark === 'string' ? spec.mark : spec.mark?.type;
  const enc = spec.encoding || {};
  // Pie: each slice gets a leader line out to a label with its value and share (computed in pixels,
  // so the chart has a fixed size). The legend keeps only the category.
  if (mark === 'arc' && !spec.layer && enc.theta?.field && enc.color?.field) {
    const v = enc.theta.field, c = enc.color.field;
    const W = 760, H = 380, R = 130, cx = W / 2, cy = H / 2;
    const ang = `2 * PI * (datum.__cum - datum['${v}'] / 2) / datum.__total`;
    const px = r => `${cx} + ${r} * sin(${ang})`, py = r => `${cy} - ${r} * cos(${ang})`;
    const side = `(sin(${ang}) >= 0 ? 1 : -1)`;
    const { mark: m, encoding, ...rest } = spec;
    const raw = { scale: null, type: 'quantitative' };
    return { ...rest, width: W, height: H, autosize: { type: 'none' },
      transform: [...(spec.transform || []),
        { joinaggregate: [{ op: 'sum', field: v, as: '__total' }] },
        { window: [{ op: 'sum', field: v, as: '__cum' }], frame: [null, 0] },
        { calculate: px(R), as: '__x0' }, { calculate: py(R), as: '__y0' },
        { calculate: px(R + 16), as: '__x1' }, { calculate: py(R + 16), as: '__y1' },
        { calculate: `datum.__x1 + 14 * ${side}`, as: '__x2' },
        { calculate: `${side} > 0 ? 'left' : 'right'`, as: '__align' },
        { calculate: `datum['${c}'] + '，' + format(datum['${v}'] / datum.__total, '.1%') + '\\n' + format(datum['${v}'], ',.0f')`, as: '__label' }],
      layer: [
        { mark: { ...(typeof m === 'object' ? m : { type: 'arc' }), outerRadius: R, strokeWidth: 1 }, encoding: { theta: { ...enc.theta, stack: true }, color: { ...enc.color, sort: null, legend: null }, tooltip: [{ field: c, type: 'nominal' }, { field: v, type: 'quantitative', format: ',.2~f' }] } },
        { mark: { type: 'rule', strokeWidth: 1 }, encoding: { x: { field: '__x0', ...raw }, y: { field: '__y0', ...raw }, x2: { field: '__x1' }, y2: { field: '__y1' }, color: { ...enc.color, sort: null, legend: null } } },
        { mark: { type: 'rule', strokeWidth: 1 }, encoding: { x: { field: '__x1', ...raw }, y: { field: '__y1', ...raw }, x2: { field: '__x2' }, y2: { field: '__y1' }, color: { ...enc.color, sort: null, legend: null } } },
        ...['left', 'right'].map(al => ({ transform: [{ filter: `datum.__align === '${al}'` }], mark: { type: 'text', fontSize: 12, align: al, dx: al === 'left' ? 3 : -3, dy: -7, baseline: 'middle', lineBreak: '\n' }, encoding: { x: { field: '__x2', ...raw }, y: { field: '__y1', ...raw }, text: { field: '__label' }, color: { ...enc.color, sort: null, legend: null } } })),
      ] };
  }
  if ((mark !== 'line' && mark !== 'bar') || spec.layer || !enc.x || !enc.y) return spec;
  const horizontal = mark === 'bar' && enc.x.type === 'quantitative' && enc.y.type !== 'quantitative';
  const value = horizontal ? enc.x : enc.y;
  if (value.type !== 'quantitative' || !value.field) return spec;
  const { mark: m, encoding, ...rest } = spec;
  const label = { type: 'text', fontSize: 11, ...(horizontal ? { align: 'left', dx: 4 } : { baseline: 'bottom', dy: -4 }) };
  return { ...rest, encoding: { x: enc.x, y: enc.y }, layer: [{ mark: m, encoding: { ...encoding } }, { mark: label, encoding: { text: { field: value.field, type: 'quantitative', format: ',.2~f' } } }] };
}

function renderOutput(el, md) {
  const charts = [];
  let html = '', last = 0, m;
  const re = /```(vega-lite|table)\s*\n([\s\S]*?)```/g;
  const text = s => { if (s.trim()) html += DOMPurify.sanitize(marked.parse(s)); };
  while ((m = re.exec(md))) {
    text(md.slice(last, m.index));
    if (m[1] === 'table') html += tableHtml(m[2]);
    else {
      // Remember the line printed right above the chart: if it is the chart's title, don't repeat it.
      const above = md.slice(last, m.index).trim().split('\n').pop().replace(/\*\*/g, '').trim();
      html += `<div class="chart" data-chart="${charts.length}"></div>`; charts.push({ src: m[2], above });
    }
    last = m.index + m[0].length;
  }
  text(md.slice(last));
  el.innerHTML = html || '<p class="note">（没有输出）</p>';
  el.querySelectorAll('[data-chart]').forEach(div => {
    if (typeof vegaEmbed !== 'function') { div.innerHTML = '<p class="note">（图表组件没有加载成功，请刷新页面）</p>'; return; }
    let spec;
    const c = charts[Number(div.dataset.chart)];
    try { spec = JSON.parse(c.src); } catch { div.innerHTML = '<p class="note">（图表格式不正确）</p>'; return; }
    const title = typeof spec.title === 'string' ? spec.title : spec.title?.text;
    if (title && c.above && title.trim() === c.above) delete spec.title;
    spec = withValueLabels(spec);
    // Only inline data: never let output make the browser fetch other URLs.
    const strip = o => { if (o && typeof o === 'object') { if (o.data && o.data.url) delete o.data.url; Object.values(o).forEach(strip); } };
    strip(spec);
    spec.width = spec.width ?? 'container';
    div._spec = spec;
    embedChart(div);
  });
}

// Charts follow the light / dark theme: grey labels and hairlines, Amber first in the palette.
const chartConfig = () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  const ink = dark ? '#ffffff' : '#151515', muted = dark ? '#969696' : '#6b6b6b', line = dark ? '#444444' : '#d2d2d2', grid = dark ? '#303030' : '#ececec';
  return {
    background: 'transparent', font: 'Inter, -apple-system, "PingFang SC", sans-serif',
    title: { color: ink, fontWeight: 500 }, view: { stroke: null },
    axis: { labelColor: muted, titleColor: muted, domainColor: line, gridColor: grid, tickColor: line },
    legend: { labelColor: muted, titleColor: muted },
    text: { color: ink }, mark: { color: '#f2a23a' }, arc: { stroke: dark ? '#181818' : '#ffffff' },
    range: { category: dark ? ['#f2a23a', '#ffffff', '#969696', '#4c98b9', '#666666', '#b8620e', '#ffd27a', '#03904a'] : ['#f2a23a', '#151515', '#8f8f8f', '#2f7fa3', '#c4c4c4', '#b8620e', '#e6c35c', '#03904a'] },
  };
};
const embedChart = div => {
  try { vegaEmbed(div, div._spec, { actions: false, renderer: 'svg', config: chartConfig() }).catch(() => { div.innerHTML = '<p class="note">（图表无法显示）</p>'; }); }
  catch { div.innerHTML = '<p class="note">（图表无法显示）</p>'; }
};
document.addEventListener('amber-theme', () => document.querySelectorAll('.chart').forEach(d => { if (d._spec) embedChart(d); }));

function showOutput(el, r, meta) {
  el.className = 'output' + (r.ok ? '' : ' err');
  if (!r.ok) { el.textContent = '❌ ' + (r.message || r.error || '执行失败'); return; }
  const body = document.createElement('div');
  renderOutput(body, r.markdown || '');
  el.innerHTML = '';
  el.appendChild(body);
  if (meta) el.insertAdjacentHTML('beforeend', `<div class="meta">${meta}</div>`);
}

// ---- state
let DATA = null;          // overview
let STORE = null;         // Amber Store: { apps, targets }
let RUNS = [];
let SETTINGS = null;      // site-wide settings (admins only): { cardFooter, defaultCardFooter, max }
let SEL = null;           // { kind: 'cmd'|'sch'|'run', key }
const ITEMS = new Map();  // key -> { kind, c?, scope?, where?, s?, r? }
const LAST = new Map();   // command key -> last result shown this page session

function scopeName(scope) {
  if (scope === 'p2p') return '我的私聊';
  if (scope === 'global') return '全局应用';
  const g = DATA.groups.find(x => 'group:' + x.chatId === scope);
  return g ? `群：${g.name}` : scope;
}

function cmdLeaf(c, scope) {
  const key = 'c:' + scope + ':' + c.id;
  ITEMS.set(key, { kind: 'cmd', c, scope });
  return `<div class="leaf" data-key="${esc(key)}" data-search="${esc((c.name + ' ' + (c.description || '')).toLowerCase())}">
    <span class="name">${esc(c.name)}</span>${c.listed ? '<span class="chip accent">已上架</span>' : ''}${c.installed ? '<span class="chip">来自 Store</span>' : ''}${c.orphan ? '<span class="chip warn">创建人已离群</span>' : ''}${c.options.confirm ? '<span class="chip warn">需确认</span>' : ''}</div>`;
}

// A schedule sits under the command it runs: the command is "what", the schedule is "when".
function schLeaf(s, scope, orphan) {
  const key = 's:' + s.id;
  ITEMS.set(key, { kind: 'sch', s, scope });
  const state = s.status === 'active' ? '运行中' : '已暂停';
  return `<div class="leaf sch ${orphan ? '' : 'child'}" data-key="${esc(key)}" data-search="${esc(s.command.toLowerCase())}">
    <span class="clock">⏰</span><span class="name">${orphan ? esc(s.command) + ' · ' : ''}${esc(s.rule.replace(/（.*）/, ''))}</span>
    <span class="state ${s.status}">${state}</span></div>`;
}

// Which folders are open. Empty when the page loads, so every folder starts folded; kept while the tree
// is redrawn after an action.
const OPEN = new Set();
let searching = false;
const node = (id, summary, inner) => `<details class="node" data-node="${esc(id)}"${OPEN.has(id) ? ' open' : ''}><summary>${summary}</summary>${inner}</details>`;

function folder(title, scope, cmds, schs) {
  const ids = new Set(cmds.map(c => c.id));
  const orphans = schs.filter(s => !ids.has(s.commandId));   // e.g. the command was retired; the schedule is paused
  const inner = (cmds.length ? cmds.map(c => cmdLeaf(c, scope) + schs.filter(s => s.commandId === c.id).map(s => schLeaf(s, scope, false)).join('')).join('') : '<div class="empty-leaf">还没有应用</div>')
    + orphans.map(s => schLeaf(s, scope, true)).join('');
  return node(scope, `${esc(title)}<span class="count">${cmds.length}</span>`, inner);
}

function renderTree() {
  ITEMS.clear();
  const o = DATA;
  let html = '<input class="search" id="q" placeholder="搜索应用">';
  if (o.membershipUnknown) html += '<div class="banner">Amber 暂时无法读取群成员，群里的应用先不显示。</div>';
  html += folder('我的私聊', 'p2p', o.p2p.commands, o.p2p.schedules);
  const groupApps = o.groups.reduce((n, g) => n + g.commands.length, 0);
  html += node('groups', `我的群聊<span class="count">${groupApps}</span>`,
    o.groups.map(g => folder(g.name, 'group:' + g.chatId, g.commands, g.schedules)).join('') || '<div class="empty-leaf">还没有群里的应用</div>');
  html += folder('全局应用', 'global', o.global, []);
  if (STORE && STORE.ok) {
    html += node('store', `Amber Store<span class="count">${STORE.apps.length}</span>`, STORE.apps.map(a => {
      const key = 'a:' + a.id;
      ITEMS.set(key, { kind: 'app', a });
      return `<div class="leaf" data-key="${esc(key)}" data-search="${esc((a.name + ' ' + (a.description || '')).toLowerCase())}"><span class="name">${esc(a.name)}</span>${a.status === 'delisted' ? '<span class="chip warn">已下架</span>' : `<span class="sub">v${esc(a.version)}</span>`}</div>`;
    }).join('') || '<div class="empty-leaf">还没有上架的应用</div>');
  }
  if (o.isAdmin && o.executors) {
    const ST = { pending: '待批准', approved: '已批准', rejected: '已拒绝', revoked: '已撤销' };
    const pending = o.executors.filter(e => e.status === 'pending').length;
    html += node('executors', `执行端（管理员）${pending ? '<span class="chip warn">待批准</span>' : ''}<span class="count">${o.executors.length}</span>`, o.executors.map(e => {
      const key = 'e:' + e.id;
      ITEMS.set(key, { kind: 'exe', e });
      const state = e.status === 'approved' ? (e.online ? '在线' : '离线') : ST[e.status] || e.status;
      return `<div class="leaf" data-key="${esc(key)}" data-search="${esc(e.name)}"><span class="dot ${e.status === 'approved' ? (e.online ? 'ok' : 'failed') : 'running'}"></span><span class="name">${esc(e.name)}</span>${e.status === 'pending' ? '<span class="chip warn">待批准</span>' : `<span class="sub">${esc(state)}</span>`}</div>`;
    }).join('') || '<div class="empty-leaf">还没有执行端登记</div>');
  }
  if (o.isAdmin && SETTINGS && SETTINGS.ok) {
    ITEMS.set('set:card-footer', { kind: 'set' });
    ITEMS.set('set:run-limits', { kind: 'set-limits' });
    ITEMS.set('set:allow-hosts', { kind: 'set-hosts' });
    html += node('settings', '系统设置（管理员）', '<div class="leaf" data-key="set:run-limits" data-search="运行限制 时限 并发"><span class="name">运行限制</span></div><div class="leaf" data-key="set:allow-hosts" data-search="网络白名单 代理 域名"><span class="name">网络白名单（本机）</span></div><div class="leaf" data-key="set:card-footer" data-search="卡片页脚 footer"><span class="name">卡片页脚</span></div>');
  }
  html += node('runs', `最近运行<span class="count">${RUNS.length}</span>`, RUNS.map(r => {
    const key = 'r:' + r.id;
    ITEMS.set(key, { kind: 'run', r });
    return `<div class="leaf" data-key="${esc(key)}" data-search="${esc(r.command.toLowerCase())}"><span class="dot ${esc(r.status)}"></span><span class="name">${esc(r.command)}</span><span class="sub">${fmtTime(r.startedAt)} · ${esc(CH[r.channel] || r.channel)}</span></div>`;
  }).join('') || '<div class="empty-leaf">还没有运行记录</div>');
  document.getElementById('tree').innerHTML = html;
  document.querySelectorAll('#tree details.node').forEach(d => d.addEventListener('toggle', () => {
    if (searching) return;   // opened by a search, not by the reader
    if (d.open) OPEN.add(d.dataset.node); else OPEN.delete(d.dataset.node);
  }));
  document.getElementById('q').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#tree .leaf').forEach(l => { l.style.display = !q || l.dataset.search.includes(q) ? '' : 'none'; });
    searching = !!q;
    // While searching every folder is open; clearing the search puts back what the reader had open.
    document.querySelectorAll('#tree details.node').forEach(d => { d.open = q ? true : OPEN.has(d.dataset.node); });
  });
  markSelected();
}

function markSelected() {
  document.querySelectorAll('#tree .leaf').forEach(l => l.classList.toggle('sel', !!SEL && l.dataset.key === SEL));
}

function select(key, push = true) {
  const it = ITEMS.get(key);
  if (!it) return welcome();
  SEL = key;
  markSelected();
  if (push) history.replaceState(null, '', '#' + encodeURIComponent(key));
  app.classList.add('detail');
  if (it.kind === 'cmd') cmdPane(key, it);
  else if (it.kind === 'sch') schPane(it);
  else if (it.kind === 'exe') exePane(it);
  else if (it.kind === 'app') appPane(it);
  else if (it.kind === 'set') footerPane();
  else if (it.kind === 'set-limits') limitsPane();
  else if (it.kind === 'set-hosts') hostsPane();
  else runPane(it);
}

const backBtn = '<button class="back btn small" data-back="1">← 返回列表</button>';

function welcome() {
  SEL = null;
  markSelected();
  app.classList.remove('detail');
  const n = DATA.p2p.commands.length + DATA.global.length + DATA.groups.reduce((a, g) => a + g.commands.length, 0);
  document.getElementById('pane').innerHTML = `<div class="welcome"><h2>选择左侧的一个应用</h2>
    <p>你一共可以使用 ${n} 个应用。选中后在这里填参数、以你本人的身份执行，结果显示在下方，和在飞书里看到的是同一份内容。</p>
    <p>需要确认的应用要点两次按钮；允许定时的应用可以在「定时」页创建定时任务。</p></div>`;
}

function paramInputs(c) {

      placeholder="${p.fromCity ? '不填则用你的办公城市' : p.default ? '默认：' + esc(p.default) + '（不填就用它）' : p.required ? '必填' : '可不填'}"></div>`).join('');
}

    <div class="where">${esc(scopeName(scope))} · 应用 ${esc(c.id)}</div>
    ${c.description ? `<div class="desc">${esc(c.description)}</div>` : '<div class="desc"></div>'}
    <div class="box">
      ${c.canRun ? '' : `<p class="note">这是别人的应用：管理员可以查看代码、设置和下线，不能执行。</p>`}

        ${c.options.confirm ? '<p class="note" style="color:var(--warn)">⚠️ 执行前需要确认：请核对参数，按钮要点两次。</p>' : ''}
        <div class="actions"><button class="btn ${c.options.confirm ? 'danger' : 'primary'}" data-do="run">${c.options.confirm ? '确认执行' : '执行'}</button>

        <p class="note">每次都以你的身份自动执行；结果发到${scope.startsWith('group:') ? '这个群' : '你和 Amber 的私聊'}，没有输出时不发。</p>
        <div class="actions"><button class="btn primary" data-do="sch">${c.options.confirm ? '确认并创建定时任务' : '创建定时任务'}</button></div>
        <div class="sch-msg note" style="margin-top:8px"></div></form>` : `<form data-form="sch" style="display:none"><p class="note">这个应用审核时没有允许定时执行，所以不能在这里创建定时任务。<br>如需定时，请让你的 agent 提交一个打开「允许定时」的新版本（同名提交），审核通过后就能在这里创建。</p></form>`}
      <form data-form="code" style="display:none"><div id="src" class="note">读取中……</div></form>`}
    </div>
    ${!c.canRun ? '' : `<div class="result-area"><h3 class="note" style="margin:0 0 8px">执行结果</h3>
    <div class="output wait" id="out">${last ? '' : '还没有在这里执行过。'}</div></div>`}
    ${(c.config || []).length ? `<div class="manage"><h3 class="note">配置项</h3>

      <button class="btn" data-retire="1">下线这个应用</button></div>` : ''}`;
  if (last && c.canRun) showOutput(document.getElementById('out'), last.r, last.meta);

async function loadMembers(scope, selector = '[data-reassign-to]') {
  const sel = document.querySelector(selector);
  const chat = scope.replace(/^group:/, '');
  const x = await fetch(`/web/api/groups/${encodeURIComponent(chat)}/members`).then(r => r.json()).catch(() => ({ ok: false }));
  if (!sel) return;
  if (!x.ok) { sel.innerHTML = '<option value="">读取失败</option>'; return; }
  sel.innerHTML = '<option value="">选择群成员</option>' + x.members.map(m => `<option value="${esc(m.unionId)}">${esc(m.name || m.unionId)}</option>`).join('');
}

const fmtDur = sec => { const m = Math.floor(sec / 60), s = sec % 60; return m === 0 ? `${s} 秒` : s === 0 ? `${m} 分钟` : `${m} 分 ${s} 秒`; };
// How long a run may take and how many may run at once: Amber's own machine, each executor (default here,
// or its own on the executor's page), and per person. Over a limit, a run is refused at once, not queued.
function limitsPane() {
  const L = SETTINGS.limits, D = SETTINGS.defaultLimits, B = SETTINGS.bounds, R = SETTINGS.running || {};
  const row = (name, label, v, b, unit, note) => `<div class="field"><label>${esc(label)}</label><div class="field-main">
    <input type="number" name="${name}" min="${b.min}" max="${b.max}" step="1" value="${esc(v)}" style="max-width:160px"> <span class="note">${esc(unit)}</span>
    <p class="note">${note}</p></div></div>`;
  const exeLines = Object.entries(L.executors || {}).map(([n, v]) => `<li><code>${esc(n)}</code>：${esc(v)} 个</li>`).join('');
  document.getElementById('pane').innerHTML = `${backBtn}
    <div class="pane-head"><h1>运行限制</h1></div>
    <div class="where">系统设置 · 管理员</div>
    <p class="desc">应用每次运行最长能跑多久，以及同时能有多少个在跑。超过上限的执行会直接提示「稍后再试」，不排队。</p>
    <form class="box" id="limits-form">
      <h3>运行时间</h3>
      ${row('defaultTimeoutSec', '默认时限', L.defaultTimeoutSec, B.timeout, '秒', `应用没有自己写时限时用这个（初始 ${fmtDur(D.defaultTimeoutSec)}）。现在：${esc(fmtDur(L.defaultTimeoutSec))}`)}
      ${row('maxTimeoutSec', '最长时限', L.maxTimeoutSec, B.timeout, '秒', `应用最多能申请这么久，超过的提交时就会被拒绝；已上线的应用超过的，运行时按这个截断（初始 ${fmtDur(D.maxTimeoutSec)}）。现在：${esc(fmtDur(L.maxTimeoutSec))}`)}
      <h3 style="margin-top:24px">同时运行</h3>
      ${row('maxConcurrentLocal', 'Amber 本机', L.maxConcurrentLocal, B.concurrency, '个', `没有写执行位置（env）的应用都在 Amber 这台机器上跑（初始 ${D.maxConcurrentLocal}）。正在运行：${R.local || 0}`)}
      ${row('maxConcurrentExecutor', '执行端（默认）', L.maxConcurrentExecutor, B.concurrency, '个', `执行端没有单独设置时用这个；可以在左侧「执行端（管理员）」里按台设置（初始 ${D.maxConcurrentExecutor}）。执行端那台机器自己也可以设上限，取两者中小的。${exeLines ? `<br>单独设置过的：<ul class="paths">${exeLines}</ul>` : ''}`)}
      ${row('maxConcurrentPerUser', '每人', L.maxConcurrentPerUser, B.concurrency, '个', `一个人同时最多运行几个，防止一个人占满名额（初始 ${D.maxConcurrentPerUser}）`)}
      <div class="actions"><button class="btn primary" type="submit">保存</button> <button class="btn" type="button" data-limits="default">恢复初始值</button></div>
    </form>`;
  const form = document.getElementById('limits-form');
  const save = async values => {
    const r = await post('/web/api/settings/run-limits', values).catch(e => ({ ok: false, message: e.message }));
    if (!r.ok) return alert(r.message || '保存失败');
    SETTINGS.limits = r.limits;
    limitsPane();
  };
  form.addEventListener('submit', ev => { ev.preventDefault(); save(Object.fromEntries([...form.querySelectorAll('input[name]')].map(i => [i.name, Number(i.value)]))); });
  form.querySelector('[data-limits=default]').addEventListener('click', () => { if (confirm('把运行时间和同时运行的上限都恢复成初始值？（各执行端单独的设置保留）')) save({ ...D, executors: undefined }); });
}

// Hosts that scripts run on Amber's own machine may reach through the local proxy (they cannot connect directly).
function hostsPane() {
  const list = SETTINGS.localAllowHosts || [];
  document.getElementById('pane').innerHTML = `${backBtn}
    <div class="pane-head"><h1>网络白名单（本机）</h1></div>
    <div class="where">系统设置 · 管理员</div>
    <p class="desc">应用不能直连网络，只能通过代理访问白名单里的地址。这里管的是在 Amber 本机运行的应用（没写执行位置的）；执行端上的应用看各自环境定义里的 allowHosts。声明了「可以访问外网」的应用不受这个限制。</p>
    <form class="box" id="hosts-form">
      <div class="field"><label>放行的地址</label><div class="field-main">
        <textarea name="hosts" rows="8" style="width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)" placeholder="每行一个，例如&#10;open.feishu.cn&#10;*.feishu.cn">${esc(list.join('\n'))}</textarea>
        <p class="note">每行一个：精确域名，或者 <code>*.域名</code>（所有子域名，不含它本身）。默认只放行 443 端口，别的端口写成 <code>域名:端口</code>。不支持 IP 地址。留空就是不放行任何地址。</p>
      </div></div>
      <div class="actions"><button class="btn primary" type="submit">保存</button></div>
    </form>`;
  const form = document.getElementById('hosts-form');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const hosts = form.hosts.value.split('\n').map(s => s.trim()).filter(Boolean);
    const r = await post('/web/api/settings/local-allow-hosts', { hosts }).catch(e => ({ ok: false, message: e.message }));
    if (!r.ok) return alert(r.message || '保存失败');
    SETTINGS.localAllowHosts = r.hosts;
    hostsPane();
  });
}

function exeLimitBlock(e) {
  if (!SETTINGS || !SETTINGS.limits) return '';
  const L = SETTINGS.limits, own = (L.executors || {})[e.name], running = (SETTINGS.running || {})['exe:' + e.name] || 0;
  return `<div class="field" style="margin-top:16px"><label>同时运行上限</label><div class="field-main">
    <input type="number" id="exe-limit" min="${SETTINGS.bounds.concurrency.min}" max="${SETTINGS.bounds.concurrency.max}" step="1" value="${esc(own ?? '')}" placeholder="默认 ${esc(L.maxConcurrentExecutor)}" style="max-width:160px">
    <button class="btn small" data-exe-limit="save">保存</button> <button class="btn small" data-exe-limit="default">用默认</button>
    <p class="note">现在：${own ? `${own} 个（单独设置）` : `${L.maxConcurrentExecutor} 个（默认）`}，正在运行 ${running} 个。那台机器自己的配置（maxParallel）也会限制，取两者中小的。</p></div></div>`;
}

function exePane({ e }) {
  const ST = { pending: '等待管理员批准', approved: '已批准', rejected: '已拒绝', revoked: '已撤销' };
  // One block per environment; every path on its own line, sorted; credential paths marked in place.
  const pathList = (l, cred) => `<ul class="paths">${[...(l || [])].sort().map(p => `<li><code>${esc(p)}</code>${cred.has(p) ? ' <span class="cred">⚠️ 凭证</span>' : ''}</li>`).join('')}</ul>`;
  const envs = Object.entries(e.envs).sort(([a], [b]) => a.localeCompare(b, 'zh')).map(([k, v]) => {
    const cred = new Set(v.credential || []);
    const vars = Object.entries(v.vars || {}).sort(([a], [b]) => a.localeCompare(b));
    return `<div class="envblock"><h3>环境「${esc(k)}」${v.source ? `<span class="sub">来源：${esc(v.source)}</span>` : ''}</h3><dl class="kv">
      <dt>{WORKDIR}</dt><dd><code>${esc(v.workdir)}</code></dd>
      ${v.interpreter ? `<dt>Python</dt><dd><code>${esc(v.interpreter)}</code></dd>` : ''}
      ${v.access.readWrite?.length ? `<dt>可读写</dt><dd>${pathList(v.access.readWrite, cred)}</dd>` : ''}
      ${v.access.readOnly?.length ? `<dt>只读</dt><dd>${pathList(v.access.readOnly, cred)}</dd>` : ''}
      ${v.access.deny?.length ? `<dt>禁止</dt><dd>${pathList(v.access.deny, new Set())}</dd>` : ''}
      ${vars.length ? `<dt>环境变量</dt><dd><ul class="paths">${vars.map(([n, x]) => `<li><code>${esc(n)}=${esc(x)}</code></li>`).join('')}</ul></dd>` : ''}
      ${v.allowHosts?.length ? `<dt>网络白名单</dt><dd><ul class="paths">${v.allowHosts.map(h => `<li><code>${esc(h)}</code></li>`).join('')}</ul><span class="note">不能直连网络，经代理只能访问这些地址</span></dd>` : ''}
      ${v.realHome ? '<dt>HOME</dt><dd>用户主目录（能访问的仍只有上面这些路径）</dd>' : ''}
      ${v.follow ? `<dt>定义文件</dt><dd><code>${esc(v.follow)}</code><br><span class="note">它的路径、环境变量、Python 变了会自动生效，并通知管理员</span></dd>` : ''}
    </dl>${cred.size ? '<p class="note cred">⚠️ 标记的是凭证路径：这个环境里的应用能使用这些凭证。</p>' : ''}</div>`;
  }).join('');
  document.getElementById('pane').innerHTML = `${backBtn}
    <div class="pane-head"><h1>${esc(e.name)}</h1><span class="chip">${esc(ST[e.status] || e.status)}${e.status === 'approved' ? (e.online ? ' · 在线' : ' · 离线') : ''}</span></div>
    <div class="where">执行端 ${esc(e.id)} · 来源机器 ${esc(e.machine)}${e.version ? ' · 版本 ' + esc(e.version) : ''}</div>
    <div class="box" style="margin-top:16px"><dl class="kv">
      <dt>公钥指纹</dt><dd><code>${esc(e.fingerprint)}</code></dd>
      <dt>申请时间</dt><dd>${fmtTime(e.createdAt)}</dd>
      <dt>最后在线</dt><dd>${e.lastSeen ? fmtTime(e.lastSeen) : '从未'}</dd>
      ${e.decidedBy ? `<dt>处理</dt><dd>${esc(e.decidedBy)} · ${fmtTime(e.decidedAt)}</dd>` : ''}
    </dl>
    ${exeLimitBlock(e)}
    ${envs}
    ${e.status === 'pending' ? `<p class="note">批准前请先和安装的人核对公钥指纹（执行端安装时会打印出来）。批准后，声明了 <code>env: "${esc(e.name)}/环境名"</code> 并通过审核的应用会在这台机器上按各自的沙箱策略执行。</p>
      <div class="actions"><button class="btn primary" data-exe="approve">批准</button> <button class="btn" data-exe="reject">拒绝</button></div>` : ''}
    ${e.status === 'approved' ? `<p class="note">撤销后立即生效：不再给它派任务，正在等结果的任务立即失败。要恢复，需要在那台机器上重新生成密钥并再次批准。</p>
      <div class="actions"><button class="btn" data-exe="revoke">撤销</button></div>` : ''}
    </div>`;
}

async function runPane({ r }) {
  document.getElementById('pane').innerHTML = `${backBtn}
    <div class="pane-head"><h1>${esc(r.command)}</h1><span class="chip">${esc(CH[r.channel] || r.channel)}</span>
      <span class="chip" style="color:${r.status === 'ok' ? 'var(--ok)' : 'var(--warn)'}">${r.status === 'ok' ? '成功' : r.status === 'failed' ? '失败' : '运行中'}</span></div>
    <div class="where">${fmtTime(r.startedAt)} · run ${esc(r.id)}${r.elapsedMs != null ? ` · ${(r.elapsedMs / 1000).toFixed(1)} 秒` : ''}${Object.keys(r.args || {}).length ? ' · ' + Object.entries(r.args).map(([k, v]) => `${esc(k)}=${esc(v)}`).join(' ') : ''}</div>
    <div class="output wait" id="out" style="margin-top:16px">读取中……</div>`;
  const x = await fetch('/web/api/runs/' + encodeURIComponent(r.id)).then(z => z.json()).catch(() => ({ ok: false }));
  const out = document.getElementById('out');
  if (!out) return;
  if (!x.ok) return showOutput(out, { ok: false, message: x.message || '读取失败' });
  if (x.status !== 'ok') return showOutput(out, { ok: false, message: x.error || x.status });
  showOutput(out, { ok: true, markdown: x.markdown });
}

function codeBlock(src, lang) {
  const code = String(src).replace(/\n$/, '');
  // highlight.js escapes the source itself; fall back to plain escaped text if it is missing.
  const body = typeof hljs === 'object' ? hljs.highlight(code, { language: lang === 'python' ? 'python' : 'plaintext', ignoreIllegals: true }).value : esc(code);
  const gutter = code.split('\n').map((_, i) => i + 1).join('\n');
  return `<div class="code"><pre class="gutter">${gutter}</pre><pre class="src"><code>${body}</code></pre></div>`;
}

async function loadSource() {
  const el = document.getElementById('src');
  const it = ITEMS.get(SEL);
  if (!el || !it || it.kind !== 'cmd' || el.dataset.loaded) return;
  const x = await fetch(`/web/api/commands/${encodeURIComponent(it.c.id)}/source?scope=${encodeURIComponent(it.scope)}`).then(r => r.json()).catch(() => ({ ok: false }));
  if (!x.ok) { el.textContent = x.message || '读取失败'; return; }
  el.dataset.loaded = '1';
  const sc = x.script;
  const how = '沙盒脚本';
  const net = sc.network ? '可访问外网' : Object.keys(sc.services).length ? `以执行人身份调用：${Object.entries(sc.services).map(([n, u]) => `${n}（每次执行最多 ${u.calls} 次调用）`).join('、')}（不能访问外网）` : '不联网';
  el.className = '';
  el.innerHTML = `<dl class="kv">
      <dt>运行方式</dt><dd>${esc(how)}，${esc(net)}，最长运行 ${esc(sc.timeoutLabel)}</dd>${sc.interpreter ? `
      <dt>解释器</dt><dd>${esc(sc.interpreter)}</dd>` : ''}${sc.env ? `
      <dt>执行位置</dt><dd>执行端 ${esc(sc.env)}</dd>` : ''}${(sc.secrets || []).length ? `
      <dt>密钥</dt><dd>${esc(sc.secrets.join('、'))}（值不在代码里，运行时由 Amber 交给脚本）</dd>` : ''}
      <dt>语言</dt><dd>${esc(sc.lang)}</dd>
      <dt>版本</dt><dd>第 ${x.history.length + 1} 版 · <code>${esc(x.specHash)}</code></dd>
      <dt>生效时间</dt><dd>${fmtTime(x.createdAt)}</dd>
      ${x.reviewDocUrl ? `<dt>审核文档</dt><dd><a href="${esc(x.reviewDocUrl)}" target="_blank" rel="noopener noreferrer">在飞书知识库查看</a></dd>` : ''}
    </dl>
    ${codeBlock(sc.code, sc.lang)}
    ${x.history.length ? `<p class="note">历史版本：${x.history.map((v, i) => `第 ${x.history.length - i} 版 <code>${esc(v.specHash.slice(0, 8))}</code>（${fmtTime(v.createdAt)}${v.reviewDocUrl ? `，<a href="${esc(v.reviewDocUrl)}" target="_blank" rel="noopener noreferrer">审核文档</a>` : ''}）`).join('；')}</p>` : ''}
    <p class="note">这就是审核通过、实际运行的代码。版本是应用定义（名称、参数、代码、选项）的哈希，每次执行前都会重新核对。</p>`;
}

function formArgs(form) {
  const args = {};
  form.querySelectorAll('input[name]').forEach(i => { if (!i.name.startsWith('__') && i.value.trim()) args[i.name] = i.value.trim(); });
  return args;
}

async function refreshRuns() {
  const r = await fetch('/web/api/runs').then(x => x.json()).catch(() => null);
  if (r && r.ok) RUNS = r.runs;
}

async function reload(keepKey) {
  const o = await fetch('/web/api/overview').then(r => r.json());
  if (!o.ok) return loginView();
  DATA = o;
  STORE = await fetch('/web/api/store').then(r => r.json()).catch(() => null);
  SETTINGS = o.isAdmin ? await fetch('/web/api/settings').then(r => r.json()).catch(() => null) : null;
  await refreshRuns();
  renderTree();
  if (keepKey && ITEMS.has(keepKey)) select(keepKey, false);
}

document.addEventListener('click', async ev => {
  const limBtn = ev.target.closest('[data-exe-limit]');
  if (limBtn) {
    const it = ITEMS.get(SEL);
    if (!it || it.kind !== 'exe') return;
    const v = document.getElementById('exe-limit').value.trim();
    const value = limBtn.dataset.exeLimit === 'default' || !v ? null : Number(v);
    const r = await post(`/web/api/executors/${it.e.id}/limit`, { value }).catch(e => ({ ok: false, message: e.message }));
    if (!r.ok) return alert(r.message || '保存失败');
    SETTINGS.limits.executors = { ...SETTINGS.limits.executors };
    if (r.limit === null) delete SETTINGS.limits.executors[it.e.name]; else SETTINGS.limits.executors[it.e.name] = r.limit;
    exePane(it);
    return;
  }
  const footerBtn = ev.target.closest('[data-footer]');
  if (footerBtn) {
    const op = footerBtn.dataset.footer;
    const typed = document.getElementById('footer-input').value.trim();
    // Saving an empty box means "back to the default"; "不显示页脚" is the explicit way to turn it off.
    const value = op === 'none' ? '' : op === 'default' || !typed ? null : typed;
    if (op === 'none' && !confirm('关闭后，卡片上不再显示任何页脚。确定吗？')) return;
    footerBtn.disabled = true;
    const r = await post('/web/api/settings/card-footer', { value }).catch(e => ({ ok: false, message: e.message }));
    footerBtn.disabled = false;
    if (!r.ok) return alert(r.message || '保存失败');
    SETTINGS.cardFooter = r.cardFooter;
    footerPane();
    return;
  }
  const exeBtn = ev.target.closest('[data-exe]');
  if (exeBtn) {
    const it = ITEMS.get(SEL);
    if (!it || it.kind !== 'exe') return;
    const op = exeBtn.dataset.exe, e = it.e;
    const ask = { approve: `批准执行端「${e.name}」？\n\n请确认公钥指纹和安装人报给你的一致：\n${e.fingerprint}`, reject: `拒绝执行端「${e.name}」的登记？`, revoke: `撤销执行端「${e.name}」？撤销后不能恢复，要重新登记。` }[op];
    if (!confirm(ask)) return;
    try {
      const r = await post(`/web/api/executors/${encodeURIComponent(e.id)}/${op}`, { confirm: true, ...(e.h ? { h: e.h } : {}) });
      if (!r.ok) alert(r.message || '操作失败');
    } catch (err) { alert(err.message); }
    return reload(SEL);
  }
  const leaf = ev.target.closest('#tree .leaf');
  if (leaf) return select(leaf.dataset.key);
  if (ev.target.closest('[data-back]')) { history.replaceState(null, '', '#'); return welcome(); }
  const ex = ev.target.closest('[data-ex]');
  if (ex) { const i = ex.closest('form').querySelector('[name=__at]'); i.value = ex.dataset.ex; i.focus(); return; }
  const tab = ev.target.closest('[data-tab]');
  if (tab) {
    tab.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === tab));
    document.querySelectorAll('#pane form').forEach(f => { f.style.display = f.dataset.form === tab.dataset.tab ? '' : 'none'; });
    document.querySelectorAll('#pane .result-area').forEach(x => { x.style.display = tab.dataset.tab === 'code' ? 'none' : ''; });
    if (tab.dataset.tab === 'code') loadSource();
    return;
  }
  const doBtn = ev.target.closest('[data-do]');
  if (doBtn) {
    ev.preventDefault();
    const key = SEL;
    const { c, scope } = ITEMS.get(key);
    const form = doBtn.closest('form');
    // Two-step button for commands that require confirmation.
    if (c.options.confirm && !doBtn.dataset.armed) {
      doBtn.dataset.armed = '1';
      const text = doBtn.textContent;
      doBtn.textContent = '再点一次确认';
      setTimeout(() => { delete doBtn.dataset.armed; doBtn.textContent = text; }, 5000);
      return;
    }
    delete doBtn.dataset.armed;
    const text = doBtn.textContent;
    doBtn.disabled = true;
    doBtn.textContent = doBtn.dataset.do === 'run' ? '执行中……' : '创建中……';
    try {
      if (doBtn.dataset.do === 'run') {
        const out = document.getElementById('out');
        out.className = 'output wait';
        out.textContent = '执行中……';
        const t0 = Date.now();
        let r = await post('/web/api/run', { scope, commandId: c.id, args: formArgs(form), confirm: c.options.confirm });
        // A long run comes back as a job: ask for it every few seconds until it ends.
        const job = r.ok && r.pending ? r.job : null;
        while (job && r.ok && r.pending) {
          if (SEL === key) document.getElementById('out').textContent = `执行中……已运行 ${Math.round((Date.now() - t0) / 1000)} 秒`;
          await new Promise(ok => setTimeout(ok, 3000));
          r = await fetch('/web/api/run-jobs/' + job).then(x => x.json()).catch(() => ({ ok: true, pending: true }));
        }
        const meta = r.ok ? `以你的身份执行 · ${(r.elapsedMs / 1000).toFixed(1)} 秒 · run ${esc(r.runId)} · ${fmtTime(Date.now())}` : '';
        LAST.set(key, { r, meta });
        if (SEL === key) showOutput(document.getElementById('out'), r, meta);
        await refreshRuns();
        const keepSel = SEL;
        renderTree();
        SEL = keepSel; markSelected();
      } else {
        const msg = form.querySelector('.sch-msg');
        const r = await post('/web/api/schedules', { scope, commandId: c.id, args: formArgs(form), at: form.querySelector('[name=__at]').value, tz: form.querySelector('[name=__tz]').value, confirm: c.options.confirm });
        msg.style.color = r.ok ? 'var(--ok)' : 'var(--warn)';
        msg.textContent = r.ok ? `✅ 已创建定时任务 ${r.scheduleId}：${r.rule}，首次运行 ${r.next}` : '❌ ' + (r.message || r.error);
        if (r.ok) { await reload(null); SEL = key; markSelected(); }
      }
    } catch (e) {
      const out = document.getElementById('out');
      if (out) { out.className = 'output err'; out.textContent = '❌ ' + e.message; }
    }
    doBtn.disabled = false;
    doBtn.textContent = text;
    return;
  }
  const ret = ev.target.closest('[data-retire]');
  if (ret) {
    const { c, scope } = ITEMS.get(SEL);
    if (!confirm(`确定下线「${c.name}」？下线后不能再执行，它的定时任务会暂停。`)) return;
    // An app's original: the app can stay in the Store (no more new versions), or go too.
    const delist = !!(c.listed && c.listed.status === 'listed') && confirm('它已上架到 Amber Store。要同时下架吗？\n确定 = 同时下架（不能再新装）；取消 = 应用留在 Store，别人照常可以安装，但不会再有新版本。');
    ret.disabled = true;
    const r = await post(`/web/api/commands/${encodeURIComponent(c.id)}/retire`, { scope, confirm: true, delist });
    if (!r.ok) { alert(r.message || r.error); ret.disabled = false; return; }
    alert(`「${r.name}」已下线${r.schedules ? `，${r.schedules} 个定时任务已暂停` : ''}${r.delisted ? '，并已从 Amber Store 下架' : ''}。`);
    history.replaceState(null, '', '#');
    await reload(null);
    welcome();
    return;
  }
  const inst = ev.target.closest('[data-app-install]');
  if (inst) {
    const target = document.querySelector('[data-app-target]').value, name = document.querySelector('[data-app-name]').value.trim();
    inst.disabled = true;
    const r = await post(`/web/api/store/${encodeURIComponent(inst.dataset.appInstall)}/install`, { target, name });
    inst.disabled = false;
    if (!r.ok) { alert(r.message || r.error); return; }
    const todo = [...(r.needs.config.length ? ['配置项：' + r.needs.config.join('、')] : []), ...(r.needs.secrets.length ? ['密钥：' + r.needs.secrets.join('、')] : [])];
    alert(`已安装「${r.name}」。${todo.length ? '\n执行前请先在应用页面底部设置' + todo.join('；') + '。' : ''}`);
    await reload('c:' + r.scope + ':' + r.commandId);
    return;
  }
  const dev = ev.target.closest('[data-app-dev]');
  if (dev) {
    const target = document.querySelector('[data-dev-target]').value, name = document.querySelector('[data-dev-name]').value.trim();
    if (!confirm('以开发模式安装？这一份会成为新的原版，你会成为维护人。')) return;
    dev.disabled = true;
    const r = await post(`/web/api/store/${encodeURIComponent(dev.dataset.appDev)}/install`, { target, name, dev: true });
    dev.disabled = false;
    if (!r.ok) { alert(r.message || r.error); return; }
    alert(`已安装「${r.name}」，它现在是这个应用的原版。`);
    await reload('c:' + r.scope + ':' + r.commandId);
    return;
  }
  const rl = ev.target.closest('[data-app-relist]');
  if (rl) {
    const r = await post(`/web/api/store/${encodeURIComponent(rl.dataset.appRelist)}/relist`, { confirm: true });
    if (!r.ok) { alert(r.message || r.error); return; }
    await reload('a:' + rl.dataset.appRelist);
    return;
  }
  const mt = ev.target.closest('[data-app-maint]');
  if (mt) {
    const email = document.querySelector('[data-maint-email]').value.trim();
    if (!email) { alert('请填写邮箱'); return; }
    const r = await post(`/web/api/store/${encodeURIComponent(mt.dataset.appMaint)}/maintainer`, { email });
    if (!r.ok) { alert(r.message || r.error); return; }
    alert(`维护人已改为 ${r.maintainer || email}。`);
    await reload('a:' + mt.dataset.appMaint);
    return;
  }
  const dl = ev.target.closest('[data-app-delist]');
  if (dl) {
    if (!confirm('下架这个应用？已经装好的照常可用，不能再新装。')) return;
    const r = await post(`/web/api/store/${encodeURIComponent(dl.dataset.appDelist)}/delist`, { confirm: true });
    if (!r.ok) { alert(r.message || r.error); return; }
    await reload('a:' + dl.dataset.appDelist);
    return;
  }
  const ud = ev.target.closest('[data-upgrade-diff]');
  if (ud) {
    const { c, scope } = ITEMS.get(SEL);
    const x = await fetch(`/web/api/commands/${encodeURIComponent(c.id)}/upgrade?scope=${encodeURIComponent(scope)}`).then(r => r.json()).catch(() => ({ ok: false }));
    const box = document.getElementById('upgrade-box');
    if (!x.ok) { box.innerHTML = `<p class="note">${esc(x.message || '读取失败')}</p>`; return; }
    const extra = [x.newConfig.length ? '新增配置项：' + x.newConfig.map(esc).join('、') : '', x.newSecrets.length ? '新增密钥：' + x.newSecrets.map(esc).join('、') : '', x.paramsChanged ? '参数有变化' : '', x.optionsChanged ? '选项有变化' : ''].filter(Boolean);
    box.innerHTML = `${x.diff === null ? '<p class="note">代码改动太大，无法逐行比较。</p>' : x.diff ? `<p class="note">代码：新增 ${esc(x.stat.added)} 行，删除 ${esc(x.stat.removed)} 行</p><pre class="diff">${esc(x.diff)}</pre>` : '<p class="note">代码没有变化。</p>'}
      ${extra.length ? `<p class="note">${extra.join('；')}${x.newConfig.length || x.newSecrets.length ? '。升级后要在下面补填，填好之前不能执行。' : ''}</p>` : ''}
      <button class="btn primary" data-upgrade="1">升级到第 ${esc(x.to)} 版</button>`;
    return;
  }
  const up = ev.target.closest('[data-upgrade]');
  if (up) {
    const { c, scope } = ITEMS.get(SEL);
    up.disabled = true;
    const r = await post(`/web/api/commands/${encodeURIComponent(c.id)}/upgrade`, { scope, confirm: true });
    if (!r.ok) { alert(r.message || r.error); up.disabled = false; return; }
    alert(`已升级到第 ${r.version} 版。`);
    await reload('c:' + scope + ':' + r.commandId);
    return;
  }
  const pub = ev.target.closest('[data-publish]');
  if (pub) {
    const { c, scope } = ITEMS.get(SEL);
    if (!confirm(`申请把「${c.name}」上架到 Amber Store？审核人通过后，别人可以安装自己的一份（自己的配置项和密钥，以自己的身份执行）。`)) return;
    pub.disabled = true;
    const r = await post(`/web/api/commands/${encodeURIComponent(c.id)}/publish`, { scope });
    if (!r.ok) { alert(r.message || r.error); pub.disabled = false; return; }
    alert('已提交上架审核，结果会私聊通知你。');
    await reload(SEL);
    return;
  }
  const cl = ev.target.closest('[data-clone]');
  if (cl) {
    const { c, scope } = ITEMS.get(SEL);
    const sel = document.querySelector('[data-clone-to]');
    if (!sel || !sel.value) { alert('请先选择群成员'); return; }
    cl.disabled = true;
    const r = await post(`/web/api/commands/${encodeURIComponent(c.id)}/clone`, { scope, to: sel.value });
    cl.disabled = false;
    alert(r.ok ? '已私聊发出确认卡，对方接收后就是他自己的应用。' : (r.message || r.error));
    return;
  }
  const ra = ev.target.closest('[data-reassign]');
  if (ra) {
    const { c, scope } = ITEMS.get(SEL);
    const sel = document.querySelector('[data-reassign-to]');
    if (!sel || !sel.value) { alert('请先选择群成员'); return; }
    if (!confirm(`把「${c.name}」交给 ${sel.options[sel.selectedIndex].text}？对方在飞书上点「接收」后才生效。`)) return;
    ra.disabled = true;
    const r = await post(`/web/api/commands/${encodeURIComponent(c.id)}/reassign`, { scope, to: sel.value });
    ra.disabled = false;
    alert(r.ok ? '已私聊发出确认卡，对方接收后生效。' : (r.message || r.error));
    return;
  }
  const cfg = ev.target.closest('[data-config]');
  if (cfg) {
    const { c, scope } = ITEMS.get(SEL);
    const [name, op] = cfg.dataset.config.split(':');
    const input = document.querySelector(`[data-config-input="${CSS.escape(name)}"]`);
    if (op === 'set' && !(input && input.value.trim())) { alert('请先填写值'); return; }
    cfg.disabled = true;
    const r = await post(`/web/api/commands/${encodeURIComponent(c.id)}/config`, op === 'set' ? { scope, name, value: input.value } : { scope, name, delete: true });
    if (!r.ok) { alert(r.message || r.error); cfg.disabled = false; return; }
    await reload(SEL);
    return;
  }
  const sec = ev.target.closest('[data-secret]');
  if (sec) {
    const { c, scope } = ITEMS.get(SEL);
    const [name, op] = sec.dataset.secret.split(':');
    const input = document.querySelector(`[data-secret-input="${CSS.escape(name)}"]`);
    if (op === 'set' && !(input && input.value)) { alert('请先填写值'); return; }
    if (op === 'delete' && !confirm(`删除密钥 ${name}？删除后这个应用不能运行，直到重新设置。`)) return;
    sec.disabled = true;
    const r = await post(`/web/api/commands/${encodeURIComponent(c.id)}/secrets`, op === 'set' ? { scope, name, value: input.value } : { scope, name, delete: true });
    if (input) input.value = '';
    if (!r.ok) { alert(r.message || r.error); sec.disabled = false; return; }
    await reload(SEL);
    return;
  }
  const sch = ev.target.closest('[data-sch]');
  if (sch) {
    const [id, op] = sch.dataset.sch.split(':');
    if (op === 'delete' && !confirm('删除这个定时任务？')) return;
    sch.disabled = true;
    const r = await post(`/web/api/schedules/${id}/${op}`, {});
    if (!r.ok) { alert(r.message || r.error); sch.disabled = false; return; }
    if (op === 'run') alert(r.lastStatus === 'failed' ? '运行失败，详情见「最近运行」' : '已运行，结果已发到原来的位置');
    await reload(op === 'delete' ? null : 's:' + id);
    if (op === 'delete') welcome();
  }
});

async function main() {
  const me = await fetch('/web/api/me').then(r => r.json()).catch(() => null);
  if (!me || !me.ok) return loginView();
  whoEl.innerHTML = `<span class="name">${esc(me.name)}</span><button id="logout">退出</button>`;
  document.getElementById('logout').onclick = async () => { await post('/web/api/logout', {}).catch(() => {}); loginView(); };
  app.className = 'split';
  app.innerHTML = '<nav id="tree"></nav><section id="pane"></section>';
  await reload(null);
  const want = decodeURIComponent(location.hash.slice(1));
  if (want && ITEMS.has(want)) select(want, false); else welcome();
}
main();
</script>
</body>
</html>
