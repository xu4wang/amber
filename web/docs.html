<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="/logo.svg">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<style>
:root {
  /* Cinematic dark: near-black canvas, one scarce Amber accent (the logo's #F2A23A), white type at weight 500, sharp corners. */
  --bg: #181818; --panel: #181818; --card: #303030; --ink: #ffffff; --muted: #969696; --muted-2: #666666; --line: #303030;
  --accent: #f2a23a; --accent-press: #b8620e; --accent-soft: rgba(242, 162, 58, 0.16); --on-accent: #181818; --ok: #03904a; --warn: #f13a2c; --info: #4c98b9;
  --chip: #303030; --hover: #222222; --code-bg: #111111;
  --hl-kw: #ff7b72; --hl-str: #a5d6a7; --hl-num: #ffb74d; --hl-cmt: #7d7d7d; --hl-fn: #90caf9; --hl-meta: #e5c07b;
  --font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.75 "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
header img { width: 28px; height: 28px; border-radius: 7px; }
header .brand { font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; }
header .back { margin-left: auto; color: var(--muted); font-size: 14px; text-decoration: none; }
header .back:hover { color: var(--accent); }
header .gh { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; text-decoration: none; margin-left: 16px; }
header .gh:hover { color: var(--accent); }
header .gh svg { width: 18px; height: 18px; fill: currentColor; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
nav { padding: 24px 12px; border-right: 1px solid var(--line); font-size: 14px; position: sticky; top: 49px; align-self: start; max-height: calc(100vh - 49px); overflow: auto; }
nav .group { color: var(--muted); font-size: 12px; margin: 14px 8px 4px; }
nav a { display: block; padding: 5px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav a:hover { background: var(--accent-soft); }
nav a.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .toc a { padding-left: 20px; color: var(--muted); font-size: 13px; }
article { padding: 24px 40px 80px; min-width: 0; }
article h1 { font-size: 28px; margin: 8px 0 16px; }
article h2 { font-size: 21px; margin: 36px 0 12px; padding-top: 8px; border-top: 1px solid var(--line); }
article h3 { font-size: 17px; margin: 24px 0 8px; }
article a { color: var(--accent); }
article table { border-collapse: collapse; margin: 12px 0; font-size: 15px; display: block; overflow-x: auto; }
article th, article td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
article th { background: var(--panel); }
article td:first-child { min-width: 5.5em; }
article code { font-family: ui-monospace, Menlo, monospace; font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
article pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; overflow: auto; line-height: 1.55; }
article pre code { background: none; padding: 0; font-size: 13px; }
article blockquote { margin: 12px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); background: var(--panel); }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-kw); font-weight: 600; }
.hljs-string, .hljs-regexp { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-comment { color: var(--hl-cmt); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--hl-fn); }
.hljs-meta, .hljs-attr, .hljs-name, .hljs-tag { color: var(--hl-meta); }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line); padding: 12px; }
  nav .toc { display: none; }
  article { padding: 16px 16px 60px; }
}

/* ---- Ferrari-inspired overrides ---- */
body { font-family: var(--font); font-size: 15px; }
header { height: 64px; padding: 0 24px; }
header img { border-radius: 0; }
header .brand { font-weight: 500; font-size: 15px; letter-spacing: 1.4px; text-transform: uppercase; }
header .back, header .gh { font-size: 12px; font-weight: 600; letter-spacing: 0.65px; text-transform: uppercase; }
header .back:hover, header .gh:hover { color: var(--ink); }
nav { top: 65px; max-height: calc(100vh - 65px); padding: 32px 12px; }
nav .group { font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted-2); margin: 20px 10px 6px; }
nav a { border-radius: 0; border-left: 2px solid transparent; color: var(--muted); }
nav a:hover { background: none; color: var(--ink); }
nav a.cur { background: none; color: var(--ink); font-weight: 600; border-left-color: var(--accent); }
nav .toc a { color: var(--muted-2); }
nav .toc a:hover { color: var(--ink); }
article { padding: 48px 56px 128px; color: #d6d6d6; }
article h1 { font-size: 56px; font-weight: 500; letter-spacing: -1.12px; line-height: 1.1; color: var(--ink); margin: 8px 0 32px; }
article h2 { font-size: 26px; font-weight: 500; letter-spacing: 0.2px; color: var(--ink); border-top: 1px solid var(--line); margin: 64px 0 16px; padding-top: 32px; }
article h3 { font-size: 18px; font-weight: 500; color: var(--ink); }
article strong { color: var(--ink); font-weight: 600; }
article a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
article a:hover { color: var(--accent); }
article table { font-size: 14px; }
article th { background: var(--card); color: var(--ink); font-weight: 600; }
article th, article td { border-color: #3a3a3a; }
article code { background: var(--card); border-radius: 0; color: var(--ink); }
article pre { background: var(--code-bg); border: none; border-radius: 0; }
article pre code { background: none; }
article blockquote { border-left: 2px solid var(--accent); background: var(--card); color: #d6d6d6; padding: 12px 20px; }
article hr { border: none; border-top: 1px solid var(--line); }
@media (max-width: 860px) { article { padding: 24px 16px 64px; } article h1 { font-size: 32px; } }
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="">
  <a class="brand" href="/">Amber</a><span style="color:var(--muted)">文档</span>
  <a class="back" href="/">← 返回网站</a>
  <a class="gh" href="https://github.com/xu4wang/amber" target="_blank" rel="noopener" title="GitHub 仓库"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <article id="doc"></article>
</div>
<script>
const DATA = __DOC_DATA__;
const REPO = 'https://github.com/xu4wang/amber/blob/main/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Same anchor rule as GitHub, so links written for the repo keep working here.
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

const doc = document.getElementById('doc');
doc.innerHTML = DOMPurify.sanitize(marked.parse(DATA.md));
const names = new Set(DATA.nav.map(n => n.name));
doc.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  const m = /^([a-z-]+)\.md(#.*)?$/.exec(h);
  if (m && names.has(m[1])) a.setAttribute('href', '/docs/' + m[1] + (m[2] || ''));
  else if (/^\.\.\//.test(h)) { a.setAttribute('href', REPO + h.replace(/^\.\.\//, '')); a.target = '_blank'; a.rel = 'noopener'; }
  else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});
const toc = [];
doc.querySelectorAll('h2, h3').forEach(h => { h.id = slug(h.textContent); if (h.tagName === 'H2') toc.push(h); });
if (typeof hljs === 'object') doc.querySelectorAll('pre code').forEach(c => {
  const lang = (c.className.match(/language-(\w+)/) || [])[1];
  if (lang && hljs.getLanguage(lang)) hljs.highlightElement(c);
});

const cur = DATA.nav.find(n => n.current);
document.getElementById('nav').innerHTML =
  '<div class="group">使用</div>' + DATA.nav.slice(0, 2).map(n => link(n)).join('') +
  '<div class="group">进阶</div>' + DATA.nav.slice(2).map(n => link(n)).join('');
function link(n) {
  const a = `<a href="/docs/${esc(n.name)}" class="${n.current ? 'cur' : ''}">${esc(n.title)}</a>`;
  return n.current && toc.length ? a + '<div class="toc">' + toc.map(h => `<a href="#${esc(h.id)}">${esc(h.textContent)}</a>`).join('') + '</div>' : a;
}
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
</body>
</html>
