<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="应用的生命周期：草稿经认领、试运行和审核后生效；生效的应用可以执行、定时、设置配置项和密钥、分享"><title>应用的生命周期：草稿经认领、试运行和审核后生效；生效的应用可以执行、定时、设置配置项和密钥、分享</title><defs><marker id="ah-lifecycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill: var(--dg-accent, #f2a23a)"/></marker></defs><rect width="100%" height="100%" style="fill: var(--dg-bg, #181818)"/><rect x="30" y="40" width="150" height="76" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="105.0" y="74.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">草稿</text><text x="105.0" y="97.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">agent 写的脚本和参数</text><rect x="260" y="40" width="170" height="76" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="345.0" y="74.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">认领与试运行</text><text x="345.0" y="97.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">创建人负责</text><rect x="510" y="40" width="150" height="76" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="585.0" y="74.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">审核</text><text x="585.0" y="97.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">全部审核人同意</text><rect x="740" y="40" width="190" height="76" style="fill: var(--dg-card, #262626); stroke: var(--dg-accent, #f2a23a)" stroke-width="2"/><text x="835.0" y="74.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">生效的应用</text><text x="835.0" y="97.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">代码按哈希锁定</text><path d="M180 78.0 L258 78.0" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-lifecycle)"/><text x="219.0" y="70.0" font-size="13" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">agent 提交</text><path d="M430 78.0 L508 78.0" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-lifecycle)"/><text x="469.0" y="70.0" font-size="13" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">提交审核</text><path d="M660 78.0 L738 78.0" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-lifecycle)"/><text x="699.0" y="70.0" font-size="13" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">通过</text><text x="595" y="140" font-size="13" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">驳回后改好，用同一个名字重新提交</text><path d="M835 116 L835 200 L135.0 200" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6"/><path d="M135.0 200 L135.0 248" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-lifecycle)"/><path d="M365.0 200 L365.0 248" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-lifecycle)"/><path d="M595.0 200 L595.0 248" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-lifecycle)"/><path d="M825.0 200 L825.0 248" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-lifecycle)"/><rect x="30" y="250" width="210" height="140" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="135.0" y="306.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">执行</text><text x="135.0" y="329.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">飞书、网站、agent</text><text x="135.0" y="350.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">以执行人的身份</text><rect x="260" y="250" width="210" height="140" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="365.0" y="296.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">定时任务</text><text x="365.0" y="319.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">按时间自动执行</text><text x="365.0" y="340.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">以创建人的身份</text><text x="365.0" y="361.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">没有输出就不发消息</text><rect x="490" y="250" width="210" height="140" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="595.0" y="296.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">配置项和密钥</text><text x="595.0" y="319.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">创建人设置一次</text><text x="595.0" y="340.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">每次执行自动带上</text><text x="595.0" y="361.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">新版本沿用，下线删除</text><rect x="720" y="250" width="210" height="140" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="825.0" y="286.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">分享</text><text x="825.0" y="309.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">复制给同群的人</text><text x="825.0" y="330.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">上架到 Store 后安装</text><text x="825.0" y="351.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">全局应用</text><text x="825.0" y="372.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">重新分配</text></svg>
