<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="执行位置：不写运行环境的应用在 Amber 本机沙箱运行，看不到业务数据；写了 env 的应用在执行端上、按运行环境的权限在沙箱里运行"><title>执行位置：不写运行环境的应用在 Amber 本机沙箱运行，看不到业务数据；写了 env 的应用在执行端上、按运行环境的权限在沙箱里运行</title><defs><marker id="ah-run-location" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill: var(--dg-accent, #f2a23a)"/></marker></defs><rect width="100%" height="100%" style="fill: var(--dg-bg, #181818)"/><rect x="30" y="110" width="170" height="80" style="fill: var(--dg-card, #262626); stroke: var(--dg-accent, #f2a23a)" stroke-width="2"/><text x="115.0" y="146.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">应用</text><text x="115.0" y="169.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">审核过的代码</text><rect x="300" y="30" width="300" height="80" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="450.0" y="56.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">Amber 本机的沙箱</text><text x="450.0" y="79.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">只有本次运行的临时目录</text><text x="450.0" y="100.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">看不到任何业务数据</text><rect x="300" y="150" width="630" height="130" style="fill: none; stroke: var(--dg-line, #4a4a4a)" stroke-dasharray="4 4"/><text x="312" y="170" font-size="12" style="fill: var(--dg-muted, #a8a8a8)" font-weight="600" text-anchor="start">数据所在的机器</text><rect x="320" y="185" width="170" height="80" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="405.0" y="221.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">执行端</text><text x="405.0" y="244.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">验签、核对代码哈希</text><rect x="530" y="185" width="180" height="80" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="620.0" y="221.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">运行环境</text><text x="620.0" y="244.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">管理员批准的路径</text><rect x="750" y="185" width="160" height="80" style="fill: var(--dg-card, #262626); stroke: var(--dg-line, #4a4a4a)" stroke-width="1.2"/><text x="830.0" y="221.0" font-size="17" style="fill: var(--dg-ink, #ffffff)" font-weight="600" text-anchor="middle">沙箱</text><text x="830.0" y="244.0" font-size="14" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">能访问环境里的数据</text><path d="M200 135 L250 135 L250 70 L298 70" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-run-location)"/><text x="225" y="60" font-size="13" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">不写 env</text><path d="M200 165 L250 165 L250 225 L318 225" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-run-location)"/><text x="225" y="245" font-size="13" style="fill: var(--dg-muted, #a8a8a8)" font-weight="400" text-anchor="middle">写了 env</text><path d="M490 225 L528 225" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-run-location)"/><path d="M710 225 L748 225" style="fill: none; stroke: var(--dg-accent, #f2a23a)" stroke-width="1.6" marker-end="url(#ah-run-location)"/></svg>
