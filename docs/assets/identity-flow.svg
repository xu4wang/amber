<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="可信身份的调用流程：执行人点执行，Amber 为执行人签发凭证并在沙盒里运行脚本，脚本带凭证调用服务，服务验签后按执行人的权限返回数据"><title>可信身份的调用流程：执行人点执行，Amber 为执行人签发凭证并在沙盒里运行脚本，脚本带凭证调用服务，服务验签后按执行人的权限返回数据</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2a23a"/></marker></defs><rect width="100%" height="100%" fill="#181818"/><rect x="20" y="70" width="200" height="110" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/><text x="120.0" y="111.0" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">执行人</text><text x="120.0" y="134.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">在飞书或网站点「执行」</text><text x="120.0" y="155.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">身份来自飞书</text><rect x="260" y="70" width="200" height="110" fill="#262626" stroke="#f2a23a" stroke-width="2"/><text x="360.0" y="101.0" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">Amber</text><text x="360.0" y="124.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">核对应用版本</text><text x="360.0" y="145.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">签发凭证</text><text x="360.0" y="166.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">sub = 执行人</text><rect x="500" y="70" width="200" height="110" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/><text x="600.0" y="111.0" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">应用脚本</text><text x="600.0" y="134.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">在沙盒里运行</text><text x="600.0" y="155.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">只能连这个服务的端口</text><rect x="740" y="70" width="200" height="110" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/><text x="840.0" y="101.0" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">服务</text><text x="840.0" y="124.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">验证签名、服务名、</text><text x="840.0" y="145.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">有效期、一次性编号</text><text x="840.0" y="166.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">按 sub 判断权限</text><path d="M222 110 L258 110" fill="none" stroke="#f2a23a" stroke-width="1.6" marker-end="url(#ah)"/><text x="240.0" y="58" font-size="13" fill="#a8a8a8" font-weight="400" text-anchor="middle">① 执行</text><path d="M462 110 L498 110" fill="none" stroke="#f2a23a" stroke-width="1.6" marker-end="url(#ah)"/><text x="480.0" y="58" font-size="13" fill="#a8a8a8" font-weight="400" text-anchor="middle">② 凭证和端口</text><path d="M702 110 L738 110" fill="none" stroke="#f2a23a" stroke-width="1.6" marker-end="url(#ah)"/><text x="720.0" y="58" font-size="13" fill="#a8a8a8" font-weight="400" text-anchor="middle">③ Authorization: Amber &lt;凭证&gt;</text><path d="M840.0 182 L840.0 240 L600.0 240 L600.0 184" fill="none" stroke="#f2a23a" stroke-width="1.6" marker-end="url(#ah)"/><text x="720.0" y="232" font-size="13" fill="#a8a8a8" font-weight="400" text-anchor="middle">④ 有权限的数据</text><path d="M570.0 184 L570.0 290 L120.0 290 L120.0 184" fill="none" stroke="#f2a23a" stroke-width="1.6" marker-end="url(#ah)"/><text x="360.0" y="282" font-size="13" fill="#a8a8a8" font-weight="400" text-anchor="middle">⑤ Amber 把结果显示给执行人</text></svg>
