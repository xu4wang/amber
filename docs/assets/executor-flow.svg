<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="执行端的工作方式：执行端主动连接 Amber；Amber 把签名并加密的任务发给执行端，执行端验签、核对代码哈希后按运行环境的权限执行，把遮盖了密钥的结果返回"><title>执行端的工作方式：执行端主动连接 Amber；Amber 把签名并加密的任务发给执行端，执行端验签、核对代码哈希后按运行环境的权限执行，把遮盖了密钥的结果返回</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2a23a"/></marker></defs><rect width="100%" height="100%" fill="#181818"/><rect x="40" y="70" width="230" height="150" fill="#262626" stroke="#f2a23a" stroke-width="2"/><text x="155.0" y="121.0" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">Amber</text><text x="155.0" y="144.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">保存审核过的应用</text><text x="155.0" y="165.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">签名任务，用执行端的</text><text x="155.0" y="186.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">公钥加密代码、参数、密钥</text><rect x="560" y="30" width="370" height="240" fill="none" stroke="#4a4a4a" stroke-dasharray="4 4"/><text x="572" y="50" font-size="12" fill="#a8a8a8" font-weight="600" text-anchor="start">数据所在的机器</text><rect x="590" y="70" width="310" height="150" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/><text x="745.0" y="121.0" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">执行端</text><text x="745.0" y="144.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">验签、核对收件人和有效期</text><text x="745.0" y="165.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">重新计算代码哈希并比对</text><text x="745.0" y="186.0" font-size="14" fill="#a8a8a8" font-weight="400" text-anchor="middle">按运行环境的权限在沙箱里执行</text><path d="M272 110 L588 110" fill="none" stroke="#f2a23a" stroke-width="1.6" marker-end="url(#ah)"/><text x="430.0" y="102" font-size="13" fill="#a8a8a8" font-weight="400" text-anchor="middle">签名 + 加密的任务</text><path d="M588 180 L272 180" fill="none" stroke="#f2a23a" stroke-width="1.6" marker-end="url(#ah)"/><text x="430" y="172" font-size="13" fill="#a8a8a8" font-weight="400" text-anchor="middle">结果（密钥已遮盖）</text><text x="300" y="250" font-size="13" fill="#a8a8a8" font-weight="400" text-anchor="middle">连接由执行端发起，执行端那台机器不用开端口</text></svg>
