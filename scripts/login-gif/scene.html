<!doctype html>
<!-- The login-page animation "为什么叫 Amber" (docs/assets/amber-why.gif). Edit here, then: node scripts/login-gif/render.mjs -->
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; background: #140C05; width: 100%; height: 100%; overflow: hidden; }
svg { display: block; }
text { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }
.mono { font-family: ui-monospace, Menlo, monospace; }
</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 720 405">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B1A0A"/><stop offset="1" stop-color="#120A04"/></linearGradient>
    <radialGradient id="resin" cx="0.38" cy="0.32" r="0.85"><stop offset="0" stop-color="#FFD27A"/><stop offset="0.45" stop-color="#F2A23A"/><stop offset="1" stop-color="#B8620E"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE6B0"/><stop offset="1" stop-color="#8A4708"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F2A23A" stop-opacity=".35"/><stop offset="1" stop-color="#F2A23A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="720" height="405" fill="url(#bg)"/>
  <g id="world"></g>
</svg>
<script>
// Deterministic animation: render(t) draws frame at time t (seconds). Loop length L.
const L = 9.0;
const W = 720, H = 405;
const world = document.getElementById('world');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// The amber drop, centred on (cx, cy) with scale k (logo path is 1024-based, drop spans ~260..764 x 150..872).
function dropPath(cx, cy, k) {
  const p = [[512,150],[512,150],[260,440],[260,610],[260,760],[372,872],[512,872],[652,872],[764,760],[764,610],[764,440],[512,150],[512,150]];
  const m = ([x, y]) => `${(cx + (x - 512) * k).toFixed(1)} ${(cy + (y - 530) * k).toFixed(1)}`;
  return `M${m(p[0])} C ${m(p[1])} ${m(p[2])} ${m(p[3])} C ${m(p[4])} ${m(p[5])} ${m(p[6])} C ${m(p[7])} ${m(p[8])} ${m(p[9])} C ${m(p[10])} ${m(p[11])} ${m(p[12])} Z`;
}
const caption = (text, op, y = 372) => op > 0 ? `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="19" fill="#F5E6CC" opacity="${op.toFixed(3)}" letter-spacing="1">${esc(text)}</text>` : '';
const sub = (text, op, y = 393) => op > 0 ? `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="12" fill="#B89A72" opacity="${op.toFixed(3)}" letter-spacing="1.5">${esc(text)}</text>` : '';
const fadeIO = (t, a, b, f = .35) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));

function render(t) {
  let g = '';
  const cx = 360, cy = 165;

  // ---------- Scene A (0 – 2.4): with AI, the run works; the model could answer differently next time.
  const aIn = seg(t, 0.1, 0.6), aOut = seg(t, 2.6, 3.0);
  const slashOp = aIn;
  // wobble: the unsealed command still drifts (model changes its mind); stops once sealed (~2.9s).
  const settle = seg(t, 2.2, 3.0);
  const wob = (1 - settle) * Math.sin(t * 9) * 9;
  // ghost variants: what another run of the model might produce
  const ghosts = 1 - seg(t, 1.9, 2.6);
  if (t < 3.2) {
    for (const [dx, dr, d] of [[-34, -16, 0.0], [32, 14, 0.5], [-14, 24, 1.0]]) {
      const op = ghosts * fadeIO(t, 0.6 + d * 0.4, 2.6, .3) * (.18 + .1 * Math.sin(t * 6 + d * 3));
      if (op > 0.01) g += `<path d="M${cx + 24 + dx} ${cy - 46} L ${cx - 24 + dx} ${cy + 72}" stroke="#F5E6CC" stroke-width="16" stroke-linecap="round" opacity="${op.toFixed(3)}" transform="rotate(${dr + wob * .6} ${cx + dx} ${cy + 13})"/>`;
    }
  }
  // the chat line that worked
  const chatOp = fadeIO(t, 0.5, 2.5, .35);
  if (chatOp > 0) {
    const typed = '> 查一下近 7 天的注册商户数'.slice(0, Math.floor(seg(t, 0.5, 1.3) * 16));
    g += `<g opacity="${chatOp.toFixed(3)}"><rect x="455" y="70" width="230" height="64" rx="0" fill="#000" opacity=".35"/>
      <text class="mono" x="468" y="96" font-size="12.5" fill="#E8D5B5">${esc(typed)}</text>
      ${t > 1.4 ? `<text class="mono" x="468" y="120" font-size="12.5" fill="#7DD3A0">✓ 跑通了</text>` : ''}</g>`;
  }

  // ---------- Scene B (2.2 – 4.6): the drop seals it.
  const fall = easeOut(seg(t, 2.1, 2.9));          // drop slides down into place
  const grow = back(seg(t, 2.3, 3.0));             // and swells around the slash
  const dropOp = seg(t, 2.1, 2.4);
  const k = 0.30 * clamp(grow, 0, 1.2);
  const dcy = lerp(-120, cy + 18, fall);
  // final brand layout: the drop moves left in scene D
  const dMove = ease(seg(t, 6.9, 7.6));
  const dx = lerp(cx, 205, dMove), dy = lerp(dcy, 170, dMove);
  const sealed = seg(t, 2.6, 3.0);                 // slash colour shifts to the frozen brown
  const endFade = 1 - seg(t, 8.55, 9.0);           // everything fades before the loop restarts
  if (dropOp > 0 && t < 9) {
    g += `<circle cx="${dx}" cy="${dy}" r="${150 * k / 0.3}" fill="url(#halo)" opacity="${(dropOp * endFade * (.7 + .3 * Math.sin(t * 2.2))).toFixed(3)}"/>`;
    g += `<path d="${dropPath(dx, dy, k)}" fill="url(#resin)" stroke="url(#rim)" stroke-width="3" opacity="${(dropOp * endFade).toFixed(3)}"/>`;
  }
  // the slash (command): white & wobbling before, dark brown & still after sealing
  {
    const sx = dropOp > 0 ? dx : cx, sy = dropOp > 0 ? dy + 4 : cy + 13;
    const s = dropOp > 0 ? k / 0.30 : 1;
    const col = sealed > 0 ? `rgb(${Math.round(lerp(245, 74, sealed))},${Math.round(lerp(230, 36, sealed))},${Math.round(lerp(204, 0, sealed))})` : '#F5E6CC';
    const op = slashOp * (1 - aOut * 0) * endFade;
    const len = 59 * s, wdt = lerp(16, 17, sealed) * s;
    // logo slash: from (566,470) to (470,760) relative to drop centre (512,530) ⇒ (+54,-60) to (-42,+230) * 0.30
    const x1 = sx + (sealed > 0 ? 16 * s : 24), y1 = sy + (sealed > 0 ? -18 * s - 4 : -59);
    const x2 = sx + (sealed > 0 ? -13 * s : -24), y2 = sy + (sealed > 0 ? 69 * s - 4 : 59);
    const X1 = lerp(cx + 24, x1, sealed), Y1 = lerp(cy - 46, y1, sealed), X2 = lerp(cx - 24, x2, sealed), Y2 = lerp(cy + 72, y2, sealed);
    if (op > 0) g += `<path d="M${X1.toFixed(1)} ${Y1.toFixed(1)} L ${X2.toFixed(1)} ${Y2.toFixed(1)}" stroke="${col}" stroke-width="${wdt.toFixed(1)}" stroke-linecap="round" opacity="${op.toFixed(3)}" transform="rotate(${wob.toFixed(2)} ${((X1 + X2) / 2).toFixed(1)} ${((Y1 + Y2) / 2).toFixed(1)})"/>`;
    void len;
  }
  // gloss on the drop
  if (dropOp > 0 && grow > .6) {
    const gk = k, go = seg(t, 2.8, 3.2) * endFade;
    const P = (x, y) => `${(dx + (x - 512) * gk).toFixed(1)} ${(dy + (y - 530) * gk).toFixed(1)}`;
    g += `<path d="M${P(392, 470)} C ${P(400, 410)} ${P(440, 350)} ${P(480, 300)} C ${P(470, 360)} ${P(452, 420)} ${P(440, 470)} C ${P(430, 505)} ${P(395, 505)} ${P(392, 470)} Z" fill="#fff" opacity="${(.55 * go).toFixed(3)}"/>`;
    g += `<circle cx="${(dx + (420 - 512) * gk).toFixed(1)}" cy="${(dy + (540 - 530) * gk).toFixed(1)}" r="${(16 * gk).toFixed(1)}" fill="#fff" opacity="${(.45 * go).toFixed(3)}"/>`;
    // a glint sweeping across once, when it seals
    const sw = seg(t, 3.0, 3.6);
    if (sw > 0 && sw < 1) g += `<path d="${dropPath(dx, dy, k)}" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="40 600" stroke-dashoffset="${(-sw * 640).toFixed(0)}" opacity=".9"/>`;
  }
  // hash stamp
  const hOp = fadeIO(t, 3.2, 6.9, .3);
  if (hOp > 0) {
    const hash = 'sha256 · 9f3a 2c7e 51b0 c71e';
    const shown = hash.slice(0, Math.floor(seg(t, 3.2, 3.9) * hash.length));
    g += `<g opacity="${hOp.toFixed(3)}" transform="translate(${cx} 312)">
      <rect x="-118" y="-17" width="236" height="26" fill="#000" opacity=".35"/>
      <path d="M-104 -6 h10 v9 h-10 z M-101.5 -6 v-3 a2.5 2.5 0 0 1 5 0 v3" fill="none" stroke="#F2A23A" stroke-width="1.6"/>
      <text class="mono" x="-86" y="1" font-size="12" fill="#F2C27A">${esc(shown)}</text></g>`;
  }

  // ---------- Scene C (4.6 – 6.9): years pass, every run is identical.
  const cOp = fadeIO(t, 4.5, 6.9, .35);
  if (cOp > 0) {
    const years = 2026 + Math.floor(easeOut(seg(t, 4.6, 6.4)) * 10);
    g += `<g opacity="${cOp.toFixed(3)}">
      <text x="110" y="150" text-anchor="middle" font-size="40" font-weight="600" fill="#F5E6CC" class="mono">${years}</text>
      <text x="110" y="176" text-anchor="middle" font-size="12" fill="#B89A72" letter-spacing="2">多年以后</text>`;
    const runs = [['第 1 次', 4.8], ['第 100 次', 5.3], ['第 10000 次', 5.8]];
    runs.forEach(([label, at], i) => {
      const o = seg(t, at, at + .3);
      if (o > 0) g += `<g opacity="${o.toFixed(3)}" transform="translate(505 ${112 + i * 40})"><text x="0" y="0" font-size="14" fill="#E8D5B5">${label}</text><text x="98" y="0" font-size="14" fill="#7DD3A0">✓ 结果一样</text></g>`;
    });
    g += `</g>`;
  }

  // ---------- captions
  g += caption('和 AI 一起，跑通一次', fadeIO(t, 0.3, 2.5));
  g += sub('但下一次，模型可能换个想法', fadeIO(t, 1.0, 2.5));
  g += caption('封存：审核通过，按哈希锁定', fadeIO(t, 2.5, 4.5));
  g += sub('改一个字，都要重新审核', fadeIO(t, 2.9, 4.5));
  g += caption('多年以后取出，还是原样', fadeIO(t, 4.6, 6.8));
  g += sub('每次执行，都和审核通过时一模一样', fadeIO(t, 5.0, 6.8));

  // ---------- Scene D (6.9 – 9): brand.
  const bOp = Math.min(seg(t, 7.3, 7.8), endFade);
  if (bOp > 0) {
    g += `<g opacity="${bOp.toFixed(3)}">
      <text x="330" y="150" font-size="52" font-weight="600" fill="#FFF3D6" letter-spacing="-1">Amber</text>
      <text x="332" y="194" font-size="22" fill="#F2C27A">AI 跑通的，Amber 封存。</text>
      <text x="333" y="226" font-size="14" fill="#B89A72" letter-spacing="1">Run it once. Keep it forever.</text>
      <text x="333" y="268" font-size="12.5" fill="#8C7454">琥珀里的「/」，是一条被封存的指令</text></g>`;
  }
  world.innerHTML = g;
}
window.render = render; window.L = L;
render(Number(new URLSearchParams(location.search).get('t') || 3.5));
</script>
</body></html>
